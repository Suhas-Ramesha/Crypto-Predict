# Fly.io configuration file
# Run: fly launch (to initialize) or fly deploy (to deploy)

app = "crypto-predict-api"
primary_region = "iad"  # US East (change to your preferred region)

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory_mb = 256
  cpu_kind = "shared"
